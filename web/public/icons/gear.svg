<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <mask id="hole">
    <rect width="24" height="24" fill="#fff"/>
    <circle cx="12" cy="12" r="3.2" fill="#000"/>
  </mask>
  <g mask="url(#hole)" fill="#000">
    <circle cx="12" cy="12" r="7.4"/>
    <rect id="tooth" x="10" y="1.5" width="4" height="5"/>
    <use href="#tooth" transform="rotate(45 12 12)"/>
    <use href="#tooth" transform="rotate(90 12 12)"/>
    <use href="#tooth" transform="rotate(135 12 12)"/>
    <use href="#tooth" transform="rotate(180 12 12)"/>
    <use href="#tooth" transform="rotate(225 12 12)"/>
    <use href="#tooth" transform="rotate(270 12 12)"/>
    <use href="#tooth" transform="rotate(315 12 12)"/>
  </g>
</svg>
