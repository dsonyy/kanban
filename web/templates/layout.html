{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .Project}}{{.Project}} - {{end}}kanban</title>
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/app.js"></script>
</head>
<body class="view-{{.View}}">
<header class="bar">
  <nav class="tabs projects">
    {{range .Projects}}<a href="/ui/{{.}}"{{if eq . $.Project}} class="on"{{end}}>{{.}}</a>{{end}}
  </nav>
  {{if .Project}}
  <nav class="tabs views">
    <a href="/ui/{{.Project}}"{{if or (eq .View "board") (eq .View "item")}} class="on"{{end}}>kanban</a>
    <a href="/ui/{{.Project}}/feed"{{if eq .View "feed"}} class="on"{{end}}>feed</a>
    <a href="/ui/{{.Project}}/graph"{{if eq .View "graph"}} class="on"{{end}}>graph</a>
    <a href="/ui/{{.Project}}/terminal"{{if eq .View "terminal"}} class="on"{{end}}>terminal</a>
    <a href="/ui/{{.Project}}/settings"{{if eq .View "settings"}} class="on"{{end}}>settings</a>
  </nav>
  {{end}}
</header>
{{template "view" .}}
<div id="flash" hidden></div>
</body>
</html>{{end}}
