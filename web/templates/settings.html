{{define "view"}}
<main class="settings">
  <form data-save="/project/{{.Project}}/board/edit">
    <h2>board.yaml</h2>
    <textarea name="body" spellcheck="false" wrap="off">{{.BoardRaw}}</textarea>
    <div class="editor-actions"><button type="submit">Save board</button></div>
  </form>
  <form data-save="/project/{{.Project}}/edit">
    <h2>project.yaml</h2>
    <textarea name="body" spellcheck="false" wrap="off" class="short">{{.ProjectRaw}}</textarea>
    <div class="editor-actions"><button type="submit">Save project</button></div>
  </form>
  <section class="history">
    <h2>History</h2>
    {{if not .History}}<p class="muted">No changes recorded yet.</p>{{end}}
    <ol class="events">
      {{range .History}}
      <li>
        <time>{{ago .At}}</time>
        <span class="commit"><span>{{.Message}}</span> <button data-post="/history/{{.Hash}}/undo" class="small">Undo</button></span>
      </li>
      {{end}}
    </ol>
  </section>
</main>
{{end}}
